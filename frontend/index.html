<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>WorkOrder</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
</head>

<body class="login-body">

    <div id="loading" class="loading-overlay" style="display:none;">
        <div class="spinner"></div>
        <p>Carregando...</p>
    </div>
    
    <div class="login-container">
        <div class="login-header">
            <h1>WorkOrder</h1>
            <p>Sistema de Ordem de Serviço</p>
        </div>

        <div class="login-form">
            <div class="login-field">
                <i class="fa fa-user"></i>
                <input type="text" id="usuario" class="login-input" placeholder="Usuário" autocomplete="off">
            </div>

            <div class="login-field">
                <i class="fa fa-lock"></i>
                <input type="password" id="senha" class="login-input" placeholder="Senha" autocomplete="off">
            </div>

            <button class="login-button" onclick="login()">Entrar</button>

            <a href="#" class="login-link">Esqueci minha senha</a>

            <p id="msg" class="login-msg"></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
